# Consumer internet / app-platform research universe -- verified 2026-10-26
# Verification methods:
#   ats        -> live fetch of the public ATS endpoint (Greenhouse boards-api / Lever postings / Ashby posting-api)
#                 or Workday site page (real site returns tenant metadata; a bogus site name on the same tenant returns 4xx)
#   wikipedia  -> fetched en.wikipedia.org/wiki/<title>; resolved title confirmed from self-referencing cite anchors (detects redirects)
#   ios_app_id -> itunes.apple.com/lookup?id=<id> returned matching trackName + sellerName
#   fiscal_year_end -> SEC EDGAR data.sec.gov/submissions/CIK##########.json "fiscalYearEnd" (also confirms ticker still listed)
# Optional extra keys used: ios_alt_app_ids (other verified apps), ats.tenant/wd/site for Workday.
#
# DROPPED (pending take-private/acquisition with shareholder approval already secured; still listed as of 2026-10-26):
#   BMBL -- Bumble agreed Oct 13, 2026 to be acquired by Ithaca Holdings at $6.05/sh cash (~$1.3B); majority written consent
#           already delivered (Blackstone + Wolfe Herd); 14C/13E-3 pending. Source: SEC 8-K ex99.1
#           https://www.sec.gov/Archives/edgar/data/0001830043/000095010326015480/dp254907_ex9901.htm
#   ROKU -- Fox Corp acquiring Roku (~$22B, announced Jun 14, 2026); Roku holders approved Oct 14, 2026 (8-K Item 5.07);
#           awaiting DOJ second-request review, expected close H1 2027. Stock now trades on deal spread, not fundamentals.
#           https://www.sec.gov/Archives/edgar/data/0001428439/000114036126039632/ef20083760_8k.htm
# No candidate was found already delisted/closed. All 32 kept tickers confirmed in SEC EDGAR submissions with live tickers.
# GRPN and U are kept but are the weakest fits (micro-cap / B2B, no consumer app) -- trim them to reach ~30.

