# Extended BACKTEST universe (phase 5): more consumer-internet / digital-consumer
# names to raise the number of historical announcements. With ~29 companies the
# test set holds roughly 400-500 events, which can only detect a rank IC of
# about 0.09-0.10; realistic alternative-data ICs are 0.02-0.05 (RESEARCH.md).
#
# These entries carry only ticker, name and segment. Wikipedia titles are
# resolved automatically from Wikidata (ticker -> article) at collection time;
# no job-board or App Store metadata, so prospective signals stay core-only.
#
# Not hand-verified like the core list: any ticker that has changed, been
# acquired or delisted is logged by the collector and skipped. Excluded on
# purpose: foreign private issuers (no 10-Q / 8-K Item 2.02) and names known to
# be under a pending take-private as of mid-2026 (e.g. EA).
#
# Survivorship bias: this list is built from companies listed in 2026, and free
# price data for delisted stocks is generally unavailable. Treat backtest
# results as optimistic for that reason.

