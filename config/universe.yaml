# Core research universe: US-listed consumer internet & app platforms (29 companies).
# Metadata verified 2026-10-26 against live sources (ATS endpoints, iTunes lookup,
# Wikipedia final titles, SEC EDGAR fiscalYearEnd). See RESEARCH.md section 1.
#
# Excluded on purpose:
#   SPOT  foreign private issuer (files 6-K/20-F): no 10-Q XBRL or 8-K Item 2.02,
#         so the SEC-based earnings dates and fundamentals cannot be built.
#   ROKU  pending acquisition by Fox (shareholders approved 2026-10-14): trades on the deal spread.
#   BMBL  pending take-private by Ithaca Holdings at $6.05/share (announced 2026-10-13).
#   GRPN, U  weakest fits (micro-cap; B2B with no consumer app).
#
# ats.provider: greenhouse | lever | ashby | smartrecruiters | workday | eightfold | custom
#   workday token = tenant|datacenter|site (disabled unless enable_workday: true)
#   custom = no supported public job-board API (UBER uses Oracle HCM, META and W use their own sites)

